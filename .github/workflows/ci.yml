name: Backend CI

"on":
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: sinistres_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent && break
            sleep 2
          done

      # Aucun backend/.env n'est present en CI (il est gitignore) : un fichier
      # vide suffit pour que les Settings retombent sur leurs valeurs par
      # defaut (mysql+pymysql://root:@localhost:3306/sinistres_db), qui
      # correspondent exactement au service MySQL ci-dessus. Sans ce fichier,
      # setup_assistant_db_user.py (qui lit/reecrit .env) echouerait.
      - name: Create empty .env
        run: touch .env

      - name: Create database schema
        run: python scripts/init_db.py

      # Provisionne assistant_ro (GRANT SELECT uniquement) et ecrit
      # ASSISTANT_DB_URL dans .env, exactement comme en local : sans ca, les
      # tests de securite de l'assistant IA qui verifient le vrai GRANT MySQL
      # (tests/test_assistant_securite.py) seraient ignores (skip) faute de
      # base joignable, au lieu d'etre reellement executes.
      - name: Provision read-only assistant DB user
        run: python scripts/setup_assistant_db_user.py

      - name: Run pytest
        run: python -m pytest tests/ -v
